<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0c110c">
<title>可樂工程行 · 出工指揮台</title>
<style>
:root{
  --ink:#050805; --bg:#0c110c; --panel:#111a12; --panel2:#16221a;
  --line:#2b3d2e; --line2:#3d5342;
  --gold:#c9a84c; --goldlit:#e3d48e; --golddim:#8a7440;
  --steel:#93a396; --txt:#eef3ea; --dim:#8fa095; --dim2:#63735f;
  --alert:#c4472f; --warn:#d08a2e; --ok:#6fa96b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(ellipse 100% 50% at 50% -10%,#16241a 0%,#0c110c 55%,#050805 100%);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom); min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,#16241a 0%,#050805 70%);padding:24px}
.lockbox{width:100%;max-width:310px;text-align:center}
.lockbox img{width:118px;height:auto;margin-bottom:14px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.7))}
.lockbox .lh{font-size:16px;font-weight:900;letter-spacing:.22em;margin-bottom:2px;color:var(--goldlit)}
.lockbox .ls{color:var(--dim2);font-size:11px;margin-bottom:22px;letter-spacing:.3em}
.lockbox input{width:100%;padding:14px;border-radius:6px;border:1px solid var(--line2);
  background:#040704;color:var(--goldlit);font-size:20px;letter-spacing:.42em;text-align:center;font-weight:700}
.lockbox input:focus{outline:none;border-color:var(--gold)}
.lockbox button{width:100%;margin-top:11px;padding:13px;border-radius:6px;border:1px solid var(--golddim);
  background:linear-gradient(180deg,#c9a84c,#9c7d33);color:#12160f;font-weight:900;font-size:14px;letter-spacing:.22em}
.lockbox button:disabled{opacity:.55}
.lerr{color:#e2705c;font-size:12px;margin-top:10px;min-height:17px}
.lremember{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:13px;color:var(--dim2);font-size:12px}
.lremember input{width:auto;padding:0;accent-color:var(--gold)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(9,14,9,.95);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:8px 12px 0}
.hrow{display:flex;align-items:center;gap:9px}
.hlogo{width:26px;height:auto;flex:0 0 auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.htitle{line-height:1.15;min-width:0}
.htitle .t1{font-size:13.5px;font-weight:900;letter-spacing:.1em;color:var(--goldlit);white-space:nowrap}
.htitle .t2{font-size:9px;color:var(--dim2);letter-spacing:.26em;white-space:nowrap}
.hspan{margin-left:auto;font-size:10px;color:var(--dim2);letter-spacing:.08em;white-space:nowrap}

.dnav{display:flex;align-items:center;gap:7px;padding:8px 0 9px}
.dbtn{flex:0 0 auto;width:32px;height:32px;border-radius:5px;border:1px solid var(--line2);
  background:var(--panel);color:var(--gold);font-size:15px;display:flex;align-items:center;justify-content:center}
.dbtn:disabled{opacity:.25}
.dbtn:active{background:var(--panel2)}
.dcenter{flex:1;min-width:0;text-align:center;line-height:1.15}
.dcenter .d1{font-size:17px;font-weight:900;letter-spacing:.06em}
.dcenter .d2{font-size:10.5px;color:var(--dim);letter-spacing:.06em;margin-top:1px}
.todaybtn{flex:0 0 auto;padding:0 10px;height:32px;border-radius:5px;border:1px solid var(--line2);
  background:var(--panel);color:var(--goldlit);font-size:11.5px;font-weight:700;letter-spacing:.1em}
.printbtn{flex:0 0 auto;width:36px;height:32px;border-radius:5px;border:1px solid var(--line2);
  background:var(--panel);color:var(--goldlit);font-size:15px;line-height:1;padding:0;cursor:pointer}
.printbtn:active{background:var(--gold);color:#0b0f0a}
.staticlink{flex:0 0 auto;padding:0 10px;height:32px;line-height:30px;border-radius:5px;
  border:1px solid var(--line2);background:var(--panel);color:#7fa7d8;font-size:11.5px;
  font-weight:700;text-decoration:none;letter-spacing:.05em}
.staticlink:hover{border-color:#7fa7d8;color:#a8c8ef}

/* ---------- 戰情條 ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border-bottom:1px solid var(--line);margin:0}
.bcell{background:var(--bg);padding:9px 6px 8px;text-align:center}
.bcell .bv{font-size:19px;font-weight:900;line-height:1;color:var(--goldlit);letter-spacing:-.02em}
.bcell .bl{font-size:9px;color:var(--dim2);letter-spacing:.14em;margin-top:4px}
.bcell.alert .bv{color:#e2705c}
.bcell.ok .bv{color:var(--ok)}
.bcell .delta{font-size:9px;font-weight:800;letter-spacing:.04em}
.bcell .delta.up{color:var(--ok)}
.bcell .delta.down{color:#e2705c}
.bcell .delta.flat{color:var(--dim2)}

main{padding:0 0 70px}
.sect-h{display:flex;align-items:center;gap:8px;padding:14px 12px 9px;
  font-size:11px;font-weight:900;letter-spacing:.24em;color:var(--golddim)}
.sect-h::before{content:"";width:3px;height:12px;background:var(--gold);flex:0 0 auto}
.sect-h .r{margin-left:auto;font-weight:600;letter-spacing:.06em;color:var(--dim2);font-size:10.5px}

/* ---------- 指揮部 ---------- */
.hq{margin:0 12px;border:1px solid var(--golddim);border-radius:7px;overflow:hidden;
  background:linear-gradient(180deg,#16241a 0%,#0e150f 100%);position:relative}
.hq::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:7px;
  box-shadow:inset 0 0 24px rgba(201,168,76,.12)}
.hq-in{display:flex;align-items:center;gap:11px;padding:11px 13px}
.hq-logo{width:52px;height:auto;flex:0 0 auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))}
.hq-txt{line-height:1.25;min-width:0}
.hq-txt .n{font-size:15px;font-weight:900;letter-spacing:.07em;color:var(--goldlit)}
.hq-txt .s{font-size:10px;color:var(--dim);letter-spacing:.16em;margin-top:3px}
.hq-flag{margin-left:auto;text-align:right;flex:0 0 auto}
.hq-flag .fv{font-size:17px;font-weight:900;color:var(--goldlit);line-height:1}
.hq-flag .fl{font-size:9px;color:var(--dim2);letter-spacing:.12em;margin-top:3px}

/* ---------- 陣地 ---------- */
.posts{display:grid;grid-template-columns:1fr;gap:9px;padding:0 12px}
@media(min-width:380px){.posts{grid-template-columns:1fr 1fr}}
@media(min-width:760px){.posts{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:1100px){.posts{grid-template-columns:repeat(4,1fr)}}

.post{border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--panel);
  position:relative;transition:border-color .15s}
.post:active{border-color:var(--gold)}
.post.under{border-color:#5a3320}
.post-plate{display:block;width:100%;height:auto;background:
  radial-gradient(ellipse 70% 60% at 50% 62%,#16281c 0%,#0d140f 100%)}

/* 名牌：HTML 文字，不用 SVG 小字 */
.post-bar{display:flex;align-items:center;gap:7px;padding:7px 9px 5px;
  border-top:1px solid var(--line);background:var(--panel2)}
.post-no{flex:0 0 auto;min-width:20px;height:17px;padding:0 4px;border-radius:3px;
  background:var(--gold);color:#0d100b;font-size:10px;font-weight:900;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center}
.post-name{font-size:13.5px;font-weight:800;color:#fff;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.post-str{flex:0 0 auto;font-size:11px;font-weight:900;color:var(--goldlit);letter-spacing:.02em}
.post-str.short{color:#e2705c}
.post-meta{display:flex;gap:9px;padding:0 9px 8px;background:var(--panel2);
  font-size:9.5px;color:var(--dim2);letter-spacing:.03em;flex-wrap:wrap}
.post-meta b{color:var(--steel);font-weight:800}
.post-meta .warnc{color:#d9a24a}

/* 人員名條 */
.crew{padding:0 9px 9px;display:flex;flex-wrap:wrap;gap:4px;background:var(--panel2)}
.mtag{display:flex;align-items:center;gap:4px;padding:3px 7px 3px 4px;border-radius:4px;
  background:#0b120c;border:1px solid #24331f;font-size:11px;color:#e8efe6;font-weight:700;
  letter-spacing:.02em;cursor:pointer;line-height:1.3}
.mtag:active{border-color:var(--gold)}
.mtag .dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.mtag.absent{color:#7d8a7e;border-color:#2a1c18;background:#120b09}
.mtag.absent .nm2{text-decoration:line-through}
.mtag .tagb{font-size:8.5px;padding:0 3px;border-radius:2px;font-weight:900;
  background:#c4472f;color:#fff;letter-spacing:0}
.mtag .tagb.half{background:#8a6d2f}

.empty{margin:0 12px;padding:34px 18px;text-align:center;color:var(--dim2);
  border:1px dashed var(--line2);border-radius:7px;font-size:13px;letter-spacing:.08em}

/* ---------- 月曆 ---------- */
.calwrap{padding:0 12px}
.calhead{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.calhead .cm{font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--goldlit)}
.calhead .cnav{margin-left:auto;display:flex;gap:5px}
.calnavbtn{width:28px;height:28px;border-radius:5px;border:1px solid var(--line2);
  background:var(--panel);color:var(--gold);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:9px;color:var(--dim2);padding-bottom:2px;letter-spacing:.06em}
.cell{aspect-ratio:1;border-radius:4px;border:1px solid transparent;background:#0e150f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11px;color:var(--dim);padding:0;line-height:1.1;position:relative}
.cell.blank{background:none;pointer-events:none}
.cell.has{color:#0d100b;font-weight:900}
.cell.dim0{color:#3d4a3f}
.cell.rest{font-weight:800;color:#7f907f}
.cell .cd{font-size:11px;font-weight:700}
.cell .cn{font-size:8.5px;opacity:.9;font-weight:800;margin-top:1px}
.cell.sel{outline:2px solid var(--gold);outline-offset:1px}
.cell.today::after{content:"";position:absolute;top:2px;right:2px;width:3px;height:3px;border-radius:50%;background:#e2705c}

footer{text-align:center;color:var(--dim2);font-size:10px;padding:18px 12px 8px;line-height:1.8;letter-spacing:.04em}
.logout{background:none;border:0;color:var(--dim2);font-size:10px;text-decoration:underline;padding:4px}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(2,4,2,.72);opacity:0;pointer-events:none;
  transition:opacity .2s;backdrop-filter:blur(2px)}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--panel);
  border-radius:12px 12px 0 0;border-top:1px solid var(--golddim);max-height:84vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;transform:translateY(102%);
  transition:transform .26s cubic-bezier(.3,1,.35,1);padding:0 0 calc(18px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
@media(min-width:620px){
  .sheet{left:50%;right:auto;bottom:auto;top:48%;transform:translate(-50%,-46%) scale(.97);
    opacity:0;width:510px;border-radius:10px;border:1px solid var(--golddim);max-height:80vh;transition:all .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
}
.shgrab{width:34px;height:3px;border-radius:2px;background:#3a4a3c;margin:9px auto 0}
.shhead{padding:12px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--panel);z-index:2}
.shhead .st1{display:flex;align-items:center;gap:9px}
.shhead .stn{font-size:17px;font-weight:900;letter-spacing:.04em;color:#fff}
.shhead .st2{font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.04em}
.shclose{margin-left:auto;width:28px;height:28px;border-radius:5px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--dim);font-size:14px;display:flex;align-items:center;justify-content:center}
.shbody{padding:12px 16px 4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.kvi{background:var(--panel2);border-radius:6px;padding:9px 11px;border:1px solid var(--line)}
.kvi .kv1{font-size:18px;font-weight:900;color:var(--goldlit)}
.kvi .kv2{font-size:10px;color:var(--dim2);margin-top:2px;letter-spacing:.1em}
.sect{font-size:10px;font-weight:900;color:var(--golddim);letter-spacing:.2em;margin:14px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:4px;background:#0b120c;
  color:#cfd9cc;border:1px solid #24331f;font-weight:600}
.chip b{color:var(--goldlit);font-weight:900;margin-left:3px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1b261c;font-size:12.5px}
.lrow:last-child{border-bottom:0}
.lrow .ld{color:var(--dim2);font-size:11px;flex:0 0 78px;letter-spacing:.02em}
.lrow .ls2{color:#cfd9cc;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagpill{font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(196,71,47,.2);
  color:#e2705c;font-weight:800;white-space:nowrap}
.tagpill.halfp{background:rgba(138,109,47,.28);color:#d9b269}
/* 人員卡動作列 */
.actRow{display:flex;gap:8px;margin:0 0 13px}
.actBtn{flex:1;text-align:center;padding:10px 8px;border-radius:5px;font-size:12.5px;
  font-weight:800;text-decoration:none;letter-spacing:.03em;transition:filter .12s}
.actBtn:hover{filter:brightness(1.15)}
.actBtn:active{transform:translateY(1px)}
.actBtn.call{background:rgba(111,169,107,.16);border:1px solid rgba(111,169,107,.42);color:#8fc98a}
.actBtn.line{background:rgba(6,199,85,.13);border:1px solid rgba(6,199,85,.38);color:#4fd88a}
.actBtn.off{background:rgba(120,130,120,.07);border:1px solid rgba(120,130,120,.2);color:#5d6a5f;pointer-events:none}
.actBtn.copy{background:rgba(139,124,246,.14);border:1px solid rgba(139,124,246,.38);color:#a99cf5;cursor:pointer}
.actBtn.done{background:rgba(111,169,107,.2);border:1px solid rgba(111,169,107,.5);color:#8fc98a}

/* 待命人員 */
.sbBox{background:linear-gradient(180deg,#151a12,#0c110c);border:1px solid #4a3d1c;border-radius:6px;padding:12px 13px}
.sbTop{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:11.5px;color:#a89160;letter-spacing:.02em}
.sbTop i{font-style:normal;font-size:13px}
.sbList{display:flex;flex-wrap:wrap;gap:7px}
.sbPill{display:inline-flex;align-items:center;gap:5px;background:rgba(224,165,86,.14);
  border:1px solid rgba(224,165,86,.42);color:#f0c98a;font-size:13px;font-weight:800;
  padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .12s}
.sbPill:hover{background:rgba(224,165,86,.24)}
.sbPill:active{transform:translateY(1px)}
.sbPill .s7{font-size:9px;color:#c9762f;font-weight:900;letter-spacing:.04em}
.sbEmpty{font-size:12px;color:#7d8b7f}

.tagpill.okp{background:rgba(111,169,107,.18);color:#8fc98a}

/* 人員檔案 */
.statusb{font-size:9.5px;padding:1.5px 6px;border-radius:3px;font-weight:900;letter-spacing:.06em;vertical-align:2px;white-space:nowrap}
.statusb.on{background:rgba(111,169,107,.22);color:#8fc98a}
.statusb.pt{background:rgba(201,168,76,.22);color:#d9b269}
.statusb.no{background:rgba(147,163,150,.13);color:#8b9a8e}
.statusb.warn{background:rgba(208,138,46,.2);color:#e0a556}
.basic-r .v a{color:var(--goldlit);text-decoration:none;font-weight:900;letter-spacing:.04em}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.kv3 .kv2{font-size:10.5px}
#shSub{font-size:12.5px}
.kv3 .kvi{padding:8px 9px}
.kv3 .kv1{font-size:16px}
.basic{background:#0b120c;border:1px solid #24331f;border-radius:5px;overflow:hidden}
.basic-r{display:flex;gap:8px;padding:7px 10px;border-bottom:1px solid #1b261c;font-size:12.5px;align-items:baseline}
.basic-r:last-child{border-bottom:0}
.basic-r .k{flex:0 0 66px;color:var(--dim2);font-size:11px;letter-spacing:.06em}
.basic-r .v{color:#e6ede4;font-weight:600;word-break:break-all;flex:1}
.basic-r .v.miss{color:#66755f;font-weight:400}
.lackbar{display:flex;align-items:flex-start;gap:6px;margin-top:9px;padding:7px 10px;border-radius:4px;
  background:rgba(196,71,47,.1);border:1px solid rgba(196,71,47,.26);font-size:11px;color:#d98a76;line-height:1.5}

/* 人物微動 */
@keyframes bob{0%,100%{transform:translate(-1.6px,0)}50%{transform:translate(1.6px,-5px)}}
.bob{animation:bob 2.4s ease-in-out infinite}

@media(prefers-reduced-motion:reduce){ .sheet,.mask{transition:none} }
</style>
</head>
<body>

<div id="lock">
  <div class="lockbox">
    <img src="assets/logo_320.png" alt="可樂工程行">
    <div class="lh">出工指揮台</div>
    <div class="ls">AUTHORIZED ONLY</div>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="通行碼">
    <button id="gobtn">進 入</button>
    <div class="lerr" id="lerr"></div>
    <label class="lremember"><input type="checkbox" id="remember" checked> 記住這台裝置</label>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="hrow">
      <img class="hlogo" src="assets/logo_160.png" alt="">
      <div class="htitle">
        <div class="t1">可樂工程行</div>
        <div class="t2">出工指揮台</div>
      </div>
      <div class="hspan" id="hrange"></div>
    </div>
    <div class="dnav">
      <button class="dbtn" id="prev" aria-label="前一天">‹</button>
      <div class="dcenter">
        <div class="d1 num" id="dMain">—</div>
        <div class="d2" id="dSub">—</div>
      </div>
      <button class="dbtn" id="next" aria-label="後一天">›</button>
      <button class="todaybtn" id="gotoToday">今日</button>
      <button class="printbtn" id="printDay" title="直接列印到 L6190 印表機" aria-label="直接列印到印表機">🖨</button>
      <button class="printbtn" id="previewDay" title="下載當日領款單 Excel 原檔" aria-label="下載領款單原檔">⬇</button>
      <a class="staticlink" id="sheetsLink" href="sheets.html" target="_blank" rel="noopener" style="color:var(--goldlit);border-color:var(--golddim)">📝 派工表</a>
      <a class="staticlink" id="staticLink" href="/static" target="_blank" rel="noopener" hidden>📋 靜態版</a>
      <a class="staticlink" id="backLink" href="javascript:void(0)" hidden>← 返回</a>
    </div>
  </header>

  <div class="board" id="board"></div>

  <main>
    <div class="sect-h">指揮部<span class="r" id="hqState"></span></div>
    <div class="hq">
      <div class="hq-in">
        <img class="hq-logo" src="assets/logo_320.png" alt="可樂工程行">
        <div class="hq-txt">
          <div class="n">可樂工程行</div>
          <div class="s">OFFICE RENOVATION · 出工指揮</div>
        </div>
        <div class="hq-flag">
          <div class="fv num" id="hqMen">—</div>
          <div class="fl">派出兵力</div>
        </div>
      </div>
    </div>

    <div class="sect-h">陣地部署<span class="r" id="postCnt"></span></div>
    <div class="posts" id="posts"></div>

    <div id="standbyWrap" style="display:none">
      <div class="sect-h" style="margin-top:16px">待命人員<span class="r" id="sbCnt"></span></div>
      <div class="sbBox" id="standby"></div>
    </div>

    <div class="sect-h" style="margin-top:14px">出工紀錄<span class="r" id="calCnt"></span></div>
    <div class="calwrap">

<script src="data.enc.js?v=68f16b98"></script>
<script>
(function(){
"use strict";
var DATA=null, DAYS=[], BYDATE={}, PIDX={}, SIDX={};
var curDate=null, curMonth=null;

/* ---------- 解密 ---------- */
function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function cat(a,b){var u=new Uint8Array(a.length+b.length);u.set(a,0);u.set(b,a.length);return u;}
async function unlock(pw){
  var e=window.__ENC__; if(!e) throw new Error('no data');
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv),tagLength:128},key,cat(b64(e.ct),b64(e.tag)));
  return JSON.parse(new TextDecoder().decode(pt));
}

function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* 制式安全帽：品牌金；紹齊支援＝橙 */
function capColor(s7,absent){ return absent?'#4e5a50':(s7?'#c9762f':'#d4b45a'); }
function capDark(s7,absent){ return absent?'#39423a':(s7?'#9c561f':'#a68c3c'); }
/* 制服色：低飽和，軍綠基底混個人色相 */
function suitColor(n,absent){
  if(absent) return '#3f4a42';
  var h=hash(n)%360, s=34+ (hash(n)%14), l=42+ (hash(n)%9);
  return 'hsl('+h+','+s+'%,'+l+'%)';
}

/* ---------- 小人（0..44 x 0..60） ---------- */
function manInner(name,s7,absent){
  var suit=suitColor(name,absent);
  var suitD=absent?'#333c36':'hsl('+(hash(name)%360)+',30%,33%)';
  var cap=capColor(s7,absent), capD=capDark(s7,absent);
  var skin=absent?'#7e8a80':'#e6c9a2';
  var ol='#050805';
  var op=absent?'0.55':'1';
  return '<g class="fig" opacity="'+op+'">'
   +'<ellipse cx="22" cy="58" rx="11" ry="2" fill="#000" opacity=".4"/>'
   +'<rect x="15.2" y="45" width="5.2" height="12" rx="1.4" fill="'+(absent?'#333c36':'#232d26')+'" stroke="'+ol+'" stroke-width=".9"/>'
   +'<rect x="23.6" y="45" width="5.2" height="12" rx="1.4" fill="'+(absent?'#333c36':'#232d26')+'" stroke="'+ol+'" stroke-width=".9"/>'
   +'<rect x="13.4" y="53.6" width="8" height="3.6" rx="1" fill="#0e1410" stroke="'+ol+'" stroke-width=".8"/>'
   +'<rect x="22.6" y="53.6" width="8" height="3.6" rx="1" fill="#0e1410" stroke="'+ol+'" stroke-width=".8"/>'
   +'<rect x="10.2" y="26" width="3.8" height="12.4" rx="1.6" fill="'+suitD+'" stroke="'+ol+'" stroke-width=".9"/>'
   +'<rect x="30" y="26" width="3.8" height="12.4" rx="1.6" fill="'+suitD+'" stroke="'+ol+'" stroke-width=".9"/>'
   +'<path d="M12.6 25.4 h18.8 l2.2 20 h-23.2 z" fill="'+suit+'" stroke="'+ol+'" stroke-width="1.2" stroke-linejoin="round"/>'
   +'<rect x="12.2" y="33.2" width="19.6" height="2.6" fill="'+(absent?'#6d786e':'#f0f4ec')+'" opacity="'+(absent?'.28':'.85')+'"/>'
   +'<circle cx="22" cy="18" r="6.8" fill="'+skin+'" stroke="'+ol+'" stroke-width="1"/>'
   +'<path d="M14.8 16.2 a7.2 7.2 0 0 1 14.4 0 q0 1.3-1.3 1.3 h-11.8 q-1.3 0-1.3-1.3z" fill="'+cap+'" stroke="'+ol+'" stroke-width="1.1" stroke-linejoin="round"/>'
   +'<rect x="13" y="15.3" width="18" height="2.2" rx="1.1" fill="'+capD+'" stroke="'+ol+'" stroke-width=".7"/>'
   +'<rect x="20.8" y="10.4" width="2.4" height="3" rx="1" fill="'+capD+'" stroke="'+ol+'" stroke-width=".7"/>'
   +'</g>';
}

/* ---------- 陣地地台（等角沙盤，墨綠 + 金邊） ---------- */
function isleShape(W,H,dy,k){
  var w=W*k,h=H*k;
  var p=[[-0.99,-0.10],[-0.58,-0.96],[0.06,-1.06],[0.93,-0.44],
         [0.86,0.54],[0.14,1.03],[-0.63,0.86]];
  var d='M';
  for(var i=0;i<p.length;i++){
    d+=(p[i][0]*w).toFixed(1)+','+((p[i][1]*h)+dy).toFixed(1);
    if(i<p.length-1) d+='L';
  }
  return d+'Z';
}

function plateSVG(site, W, H){
  var DEP=Math.round(W*0.125);
  var cx=W/2, cy=H*0.5;
  var hw=W*0.44, hh=H*0.30;
  var s='<svg class="post-plate" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  // 地台投影
  s+='<ellipse cx="'+cx+'" cy="'+(cy+hh*1.5+DEP)+'" rx="'+(hw*0.95)+'" ry="'+(hh*0.4)+'" fill="#000" opacity=".4"/>';
  // 岩層
  s+='<path d="'+isleShape(hw,hh,DEP*2.3,0.72)+'" transform="translate('+cx+','+cy+')" fill="#1c2a1e"/>';
  // 土層
  s+='<path d="'+isleShape(hw,hh,DEP*1.3,0.87)+'" transform="translate('+cx+','+cy+')" fill="#2c3b2b"/>';
  // 沙盤面
  s+='<path d="'+isleShape(hw,hh,0,1)+'" transform="translate('+cx+','+cy+')" fill="#33482f" stroke="#c9a84c" stroke-width="1.3" stroke-opacity=".75"/>';
  // 內圈（陣地範圍線）
  s+='<path d="'+isleShape(hw,hh,0,0.62)+'" transform="translate('+cx+','+cy+')" fill="none" stroke="#7d8a5a" stroke-width=".8" stroke-dasharray="3 4" opacity=".55"/>';

  // 人物
  var ppl=site.people;
  var n=ppl.length;
  var perRow=Math.min(n,3); if(perRow<1) perRow=1;
  var scale=Math.min(0.82,(H*0.40)/60);
  var stepX=W*0.235, stepY=H*0.115;
  var baseY=cy+hh*0.34;
  var slots=[];
  ppl.forEach(function(p,i){
    var r=Math.floor(i/perRow), c=i%perRow;
    var inRow=Math.min(perRow, n-r*perRow);
    var px=cx+(c-(inRow-1)/2)*stepX;
    var py=baseY-r*stepY;
    var sc=scale*(1-r*0.08);
    var absent=(p.tag==='沒出來');
    s+='<g transform="translate('+px.toFixed(1)+','+py.toFixed(1)+')">'
      +'<g class="bob" style="animation-delay:'+((i*0.27)%2.4).toFixed(2)+'s">'
      +'<g transform="scale('+sc.toFixed(3)+') translate(-22,-60)">'
      +manInner(p.n,p.s7,absent)
      +'</g></g></g>';
    slots.push({x:px,y:py,sc:sc,p:p});
  });

  // 陣地標記（金色小旗桿，標在左上角）
  s+='<g transform="translate('+(cx-hw*0.55)+','+(cy-hh*0.75)+')">'
    +'<line x1="0" y1="0" x2="0" y2="-16" stroke="#c9a84c" stroke-width="1.6"/>'
    +'<path d="M0,-16 L11,-13 L0,-10 Z" fill="#c9a84c"/>'
    +'</g>';
  s+='</svg>';
  return s;
}

/* ---------- 佈局 ---------- */
function plateSize(){
  var wrap=document.getElementById('posts');
  var cw=wrap?wrap.clientWidth:360;
  var cols = cw>=1100?4:(cw>=760?3:(cw>=430?2:1));
  var gap = 9;
  var w=Math.floor((cw-gap*(cols-1))/cols);
  w=Math.max(150,Math.min(280,w));
  return {W:w, H:Math.round(w*0.62)};
}

/* ---------- 索引 ---------- */
function buildIndex(days){
  PIDX={};SIDX={};
  days.forEach(function(d){
    d.sites.forEach(function(s){
      if(!SIDX[s.name]) SIDX[s.name]={name:s.name,daySet:{},people:{},headByDate:{},total:0};
      SIDX[s.name].daySet[d.date]=1;
      SIDX[s.name].headByDate[d.date]=s.people.length;
      SIDX[s.name].total+=s.people.length;
      s.people.forEach(function(p){
        if(!PIDX[p.n]) PIDX[p.n]={name:p.n,s7:false,daySet:{},sites:{},tags:{}};
        if(p.s7) PIDX[p.n].s7=true;
        PIDX[p.n].daySet[d.date]=1;
        PIDX[p.n].sites[s.name]=(PIDX[p.n].sites[s.name]||0)+1;
        SIDX[s.name].people[p.n]=(SIDX[s.name].people[p.n]||0)+1;
        if(p.tag) PIDX[p.n].tags[d.date+'|'+s.name]=p.tag;
      });
    });
  });
}

/* 陣地常態編制：該陣地最近 30 個有紀錄日的平均人數 */
function normStrength(siteName, uptoDate){
  var s=SIDX[siteName]; if(!s) return null;
  var ds=Object.keys(s.headByDate).filter(function(d){return d<=uptoDate;}).sort().slice(-30);
  if(ds.length<3) return null;
  var sum=ds.reduce(function(a,d){return a+s.headByDate[d];},0);
  return {avg:sum/ds.length, n:ds.length};
}

/* ---------- 日期 ---------- */
var WD=['週日','週一','週二','週三','週四','週五','週六'];
function wdOf(iso){var t=new Date(iso+'T00:00:00');return WD[t.getDay()];}
function prevWorkday(iso){
  var i=DAYS.indexOf(iso);
  return i>0?DAYS[i-1]:null;
}

/* ---------- 主渲染 ---------- */
function renderStandby(){
  var wrap=document.getElementById('standbyWrap');
  var box=document.getElementById('standby');
  var cnt=document.getElementById('sbCnt');
  if(!wrap||!box) return;
  var sb=DATA.standby;
  /* 報班資料只有當天有，切到歷史日期就隱藏 */
  if(!sb||!sb.ok||sb.date!==curDate){
    wrap.style.display='none';
    return;
  }
  /* 以當日領款單 sites 為準，重新計算已安排人員，修正生成器的差集誤判 */
  var assignedSet={};
  var d=BYDATE[curDate];
  if(d&&Array.isArray(d.sites)){
    d.sites.forEach(function(s){
      (s.people||[]).forEach(function(p){
        assignedSet[(p.n||'')+'|'+(p.s7?'1':'0')]=true;
      });
    });
  }
  var reported=sb.reported||[];
  var list=reported.filter(function(p){
    return !assignedSet[(p.n||'')+'|'+(p.s7?'1':'0')];
  });
  var reported_count=reported.length;
  var assigned_count=reported.filter(function(p){
    return !!assignedSet[(p.n||'')+'|'+(p.s7?'1':'0')];
  }).length;
  wrap.style.display='';
  cnt.textContent='報班 '+reported_count+' 人 · 已派工 '+assigned_count+' 人 · 待命 '+list.length+' 人'
    +(sb.fetched_at?'　'+sb.fetched_at.slice(11)+' 抓取':'');
  if(!list.length){
    box.innerHTML='<div class="sbEmpty">報班的人都派出去了，沒有待命。</div>';
    return;
  }
  var h='<div class="sbTop"><i>⏳</i><span>已報班但還沒排到工作 — 可調派支援</span></div><div class="sbList">';
  list.forEach(function(p){
    h+='<div class="sbPill" data-p="'+esc(p.n)+'">'
      +(p.s7?'<span class="s7">S7</span>':'')+esc(p.n)+'</div>';
  });
  h+='</div>';
  box.innerHTML=h;
}

/* 列印伺服器（公司電腦 L6190 直印）。
   本機開 http://127.0.0.1:5001/ → 同源，按鈕可直接作用。
   從 GitHub Pages（https）開 → Chrome 封鎖跨協定，改成複製網址。 */
var IS_LOCAL_HTTP = (location.protocol === 'http:');
var PRINT_SERVER = IS_LOCAL_HTTP ? location.origin : 'http://100.117.16.1:5001';
var PRINT_TOKEN  = 'cola_print_secure_888';

function goBackToStatic(){
  if(window.history.length > 1){
    window.history.back();
  }else{
    alert('這一頁是直接開啟的，沒有上一頁可回。\n\n'
        + '請從靜態版的「🎖 互動版」按鈕點進來，或自己在檔案總管開啟：\n'
        + 'D:\\googledrive\\可樂工程行共用資料夾\\粗工出勤表格\\出工派工儀表板.html');
  }
}

function copyUrl(url){
  function fallback(){ window.prompt('已為你準備好網址，按 Ctrl+C 複製：', url); }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        alert('已複製網址。\n\n切到瀏覽器分頁，貼到網址列按 Enter 就會執行。');
      }).catch(fallback);
    }else{
      fallback();
    }
  }catch(e){ fallback(); }
}

function printToPrinter(){
  var d = BYDATE[curDate];
  if(!d || !d.sites || d.sites.length===0){ alert('這天沒有出工紀錄，無法列印'); return; }
  var url = PRINT_SERVER + '/print?date=' + encodeURIComponent(curDate)
          + '&token=' + encodeURIComponent(PRINT_TOKEN);
  if(!IS_LOCAL_HTTP){ copyUrl(url); return; }

  fetch(url, {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/<h1>([^<]*)<\/h1>/);
    var p = t.match(/<p>([^<]*)<\/p>/);
    alert((m ? m[1] : '完成') + '\n\n' + (p ? p[1] : ''));
  }).catch(function(e){
    alert('列印失敗：' + e.message + '\n\n請確認公司電腦的列印服務正在執行。');
  });
}

function downloadSheet(){
  var d = BYDATE[curDate];
  if(!d || !d.sites || d.sites.length===0){ alert('這天沒有出工紀錄'); return; }
  var url = PRINT_SERVER + '/file?date=' + encodeURIComponent(curDate)
          + '&token=' + encodeURIComponent(PRINT_TOKEN);
  if(!IS_LOCAL_HTTP){ copyUrl(url); return; }
  window.location.href = url;
}


function renderDay(){
  var d=BYDATE[curDate];
  var idx=DAYS.indexOf(curDate);
  renderStandby();
  var mainEl=document.getElementById('dMain'), subEl=document.getElementById('dSub');

  if(!d){
    mainEl.textContent=curDate.slice(5).replace('-','/');
    subEl.textContent=wdOf(curDate)+' · 無領款單紀錄';
    document.getElementById('board').innerHTML='';
    document.getElementById('posts').innerHTML=
      '<div class="empty" style="grid-column:1/-1">這天沒有領款單紀錄</div>';
    document.getElementById('postCnt').textContent='';
    document.getElementById('hqMen').textContent='—';
    document.getElementById('hqState').textContent='';
    renderCal();
    document.getElementById('prev').disabled=(idx<=0);
    document.getElementById('next').disabled=(idx>=DAYS.length-1);
    return;
  }

  var isRest=(d.head===0||d.sites.length===0);
  mainEl.textContent=curDate.slice(5).replace('-','/');
  subEl.textContent=wdOf(curDate)+' · '+(isRest?'全員休息':'兵力 '+d.head+' 人');
  document.getElementById('hqMen').textContent=d.head;

  /* 統計 */
  var absent=0,half=0,s7n=0;
  d.sites.forEach(function(s){s.people.forEach(function(p){
    if(p.tag==='沒出來')absent++;
    if(p.tag==='半天')half++;
    if(p.s7)s7n++;
  })});

  var pd=prevWorkday(curDate);
  var prevHead=pd&&BYDATE[pd]?BYDATE[pd].head:null;
  var delta=(prevHead!=null && prevHead>0)?(d.head-prevHead):null;

  var mNow=curDate.slice(0,7);
  var mTotal=0;
  DAYS.forEach(function(x){ if(x.slice(0,7)===mNow) mTotal+=BYDATE[x].head; });

  document.getElementById('board').innerHTML=
     '<div class="bcell"><div class="bv num">'+d.head
       +(delta!=null?' <span class="delta '+(delta>0?'up':delta<0?'down':'flat')+'">'+(delta>0?'▲'+delta:delta<0?'▼'+Math.abs(delta):'—')+'</span>':'')
       +'</div><div class="bl">總兵力'+(delta!=null?' · 較前日':'')+'</div></div>'
    +'<div class="bcell"><div class="bv num">'+d.sites.length+'</div><div class="bl">陣地（處）</div></div>'
    +'<div class="bcell '+(absent>0?'alert':'ok')+'"><div class="bv num">'+absent+'</div><div class="bl">未到</div>'
       +'<div class="delta flat">'+(half>0?'半日勤 '+half:'—')+'</div></div>'
    +'<div class="bcell"><div class="bv num">'+mTotal+'</div><div class="bl">本月累計（工）</div></div>';

  document.getElementById('hqState').textContent=isRest?'全員休息':'人員已派出';

  /* 陣地卡 */
  var order=d.sites.slice().sort(function(a,b){return b.people.length-a.people.length;});
  var size=plateSize();
  var html='';
  if(!order.length){
    html='<div class="empty" style="grid-column:1/-1">今日全員休息，沒有部署</div>';
    document.getElementById('postCnt').textContent='';
  } else {
    document.getElementById('postCnt').textContent=order.length+' 處 · '+d.head+' 人';
  }

  order.forEach(function(site,si){
    var no=String(si+1).padStart(2,'0');
    var present=site.people.filter(function(p){return p.tag!=='沒出來';}).length;
    var ns=normStrength(site.name, curDate);
    var S=SIDX[site.name];
    var days=S?Object.keys(S.daySet).length:0;
    var gap=(ns && present<ns.avg-1.5) ? Math.round(ns.avg-present) : 0;

    html+='<div class="post'+(gap>0?' under':'')+'">';
    html+=plateSVG(site, size.W, size.H);
    html+='<div class="post-bar">'
        +'<span class="post-no">'+no+'</span>'
        +'<span class="post-name">'+esc(site.name)+'</span>'
        +'<span class="post-str num'+(present<site.people.length?' short':'')+'">'
          +(present<site.people.length?(present+'/'+site.people.length):site.people.length)+' 人</span>'
        +'</div>';
    html+='<div class="post-meta">'
        +'<span>進駐 <b>'+days+'</b> 日</span>'
        +(ns?'<span>平時 <b>'+Math.round(ns.avg)+'</b> 人</span>':'')
        +(gap>0?'<span class="warnc">少 '+gap+' 人</span>':'')
        +'</div>';
    html+='<div class="crew">';
    site.people.forEach(function(p){
      var absent2=(p.tag==='沒出來');
      var tagTxt=(p.tag==='沒出來')?'缺':(p.tag==='半天'?'半':p.tag);
      html+='<div class="mtag'+(absent2?' absent':'')+'" data-p="'+esc(p.n)+'">'
          +'<span class="dot" style="background:'+(absent2?'#4a544c':capColor(p.s7,false))+'"></span>'
          +'<span class="nm2">'+esc(p.n)+(p.s7?' <b style="color:#c9762f;font-size:9px">S7</b>':'')+'</span>'
          +(p.tag?'<span class="tagb'+(p.tag==='半天'?' half':'')+'">'+esc(tagTxt)+'</span>':'')
          +'</div>';
    });
    html+='</div></div>';
  });

  document.getElementById('posts').innerHTML=html;
  renderCal();
  document.getElementById('prev').disabled=(idx<=0);
  document.getElementById('next').disabled=(idx>=DAYS.length-1);
}

/* ---------- 月曆 ---------- */
function renderCal(){
  if(!curMonth) return;
  var y=+curMonth.slice(0,4), m=+curMonth.slice(5,7);
  document.getElementById('calMonth').textContent=y+' / '+String(m).padStart(2,'0');
  var first=new Date(y,m-1,1), startDow=first.getDay();
  var dim=new Date(y,m,0).getDate();
  var counts={};
  DAYS.forEach(function(iso){ if(iso.slice(0,7)===curMonth) counts[iso]=BYDATE[iso].head; });
  var maxC=1, mh=0;
  Object.keys(counts).forEach(function(k){maxC=Math.max(maxC,counts[k]);mh+=counts[k];});
  document.getElementById('calCnt').textContent=Object.keys(counts).length+' 天 · 累計 '+mh+' 工';

  var t=new Date();
  var todayIso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  var h='';
  ['日','一','二','三','四','五','六'].forEach(function(w){h+='<div class="wd">'+w+'</div>';});
  for(var i=0;i<startDow;i++) h+='<div class="cell blank"></div>';
  for(var dd=1;dd<=dim;dd++){
    var iso=y+'-'+String(m).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    var rec=counts[iso], c=(rec===undefined?null:rec);
    var cls='cell', style='';
    if(c===null){ cls+=' dim0'; }
    else if(c===0){ cls+=' rest'; style='background:#141d16'; }
    else{
      var a=0.14+(c/maxC)*0.78;
      style='background:rgba(201,168,76,'+a.toFixed(2)+');color:#0d100b';
      cls+=' has';
    }
    if(iso===curDate) cls+=' sel';
    if(iso===todayIso) cls+=' today';
    h+='<button class="'+cls+'" data-d="'+iso+'" style="'+style+'">'
      +'<span class="cd">'+dd+'</span>'
      +(c>0?'<span class="cn">'+c+'</span>':(c===0?'<span class="cn">休</span>':''))
      +'</button>';
  }
  document.getElementById('cal').innerHTML=h;
}

/* ---------- sheet ---------- */
function showSheet(){document.getElementById('sheet').classList.add('on');document.getElementById('mask').classList.add('on');}
function closeSheet(){document.getElementById('sheet').classList.remove('on');document.getElementById('mask').classList.remove('on');}

function lineUrl(v){
  if(!v) return null;
  var s=String(v).trim().replace(/^電話號碼[:：]\s*/,'').replace(/\s/g,'');
  if(!s||s==='沒有設'||s==='無'||s==='none') return null;
  if(/^09\d{8}$/.test(s)) return 'https://line.me/ti/p/'+s;
  if(/^\+?8869\d{8}$/.test(s)) return 'https://line.me/ti/p/0'+s.replace(/^\+?886/,'');
  return 'https://line.me/ti/p/~'+encodeURIComponent(s);
}

function copyName(btn, n){
  function ok(){
    btn.classList.add('done');
    var old = btn.innerHTML;
    btn.innerHTML = '✓ 已複製';
    setTimeout(function(){ btn.classList.remove('done'); btn.innerHTML = old; }, 1800);
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(n).then(ok).catch(function(){ prompt('複製名字：', n); });
    }else{
      var ta = document.createElement('textarea');
      ta.value = n; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); ok();
    }
  }catch(e){ prompt('複製名字：', n); }
}

function personSheet(name){
  var dropped=(DATA.employee_meta&&DATA.employee_meta.dropped)||[];
  if(dropped.indexOf(name)>=0){
    document.getElementById('shName').textContent=name;
    document.getElementById('shSub').textContent='業主／非師傅';
    document.getElementById('shBody').innerHTML=
      '<div class="lackbar" style="background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.26);color:#d9b269">'
      +'<span>ℹ</span><span>此人為業主，不列入師傅人員檔案（出工紀錄仍保留在當日明細）。</span></div>';
    showSheet(); return;
  }
  var e=(DATA.employees&&DATA.employees[name]);
  var p=PIDX[name];
  if(!e && !p) return;

  if(!e){
    // 舊資料 fallback
    var dd=Object.keys(p.daySet).length;
    document.getElementById('shName').textContent=p.name;
    document.getElementById('shSub').textContent='累計出工 '+dd+' 天';
    document.getElementById('shBody').innerHTML='<div class="lackbar">此人的出勤檔案尚未建立</div>';
    showSheet(); return;
  }

  var stTxt=e.status;
  var stCls=e.status==='在職'?'on':(e.status==='打工'?'pt':(e.status==='履歷未更新'?'warn':'no'));
  document.getElementById('shName').innerHTML=
     esc(name)
    +(e.s7?' <span style="font-size:10px;color:#c9762f;font-weight:900">S7 紹齊</span>':'')
    +' <span class="statusb '+stCls+'">'+(stTxt||'未登錄')+'</span>';
  document.getElementById('shSub').textContent=
     '累計 '+e.days+' 天 · 本月 '+e.monthDays+' 天 · 最後出工 '+e.last.slice(5).replace('-','/');

  var h='';

  /* 快速動作：撥電話／開 LINE */
  var bb=e.basic||{};
  var telHref = bb.phone ? 'tel:'+String(bb.phone).replace(/[^0-9+]/g,'') : '';
  var lineHref = lineUrl(bb.line);
  var lineViaPhone = false;
  if(!lineHref && bb.phone){
    var p10 = String(bb.phone).replace(/[^0-9]/g,'').replace(/^886/,'0');
    if(/^09\d{8}$/.test(p10)){ lineHref = 'https://line.me/ti/p/' + p10; lineViaPhone = true; }
  }
  var lineBtn;
  if(lineHref){
    lineBtn = '<a class="actBtn line" href="'+lineHref+'" target="_blank" rel="noopener">'
      +(lineViaPhone?'💬 LINE（用電話找）':'💬 開 LINE')+'</a>';
  }else{
    lineBtn = '<button class="actBtn copy" onclick="copyName(this,\''+esc(name)+'\')">📋 複製名字</button>';
  }
  h+='<div class="actRow">'
    +(telHref ? '<a class="actBtn call" href="'+telHref+'">📞 撥電話</a>'
              : '<span class="actBtn off">📞 無電話</span>')
    +lineBtn
    +'</div>';

  /* 出勤概況 */
  h+='<div class="kv3">'
    +'<div class="kvi"><div class="kv1 num">'+e.days+'</div><div class="kv2">累計天數</div></div>'
    +'<div class="kvi"><div class="kv1 num">'+e.monthDays+'</div><div class="kv2">本月</div></div>'
    +'<div class="kvi"><div class="kv1 num">'+e.last30+'</div><div class="kv2">近 30 日</div></div>'
    +'</div>';

  /* 基本資料 */
  var B=e.basic||{};
  h+='<div class="sect">基本資料</div><div class="basic">';
  var rows=[["電話","phone"],["性別","sex"],["生日","birth"],["身分證","idmask"],["地址","addr"],["Line","line"],["E-mail","email"]];
  rows.forEach(function(r){
    var v=B[r[1]];
    var val='未建檔';
    if(v){
      if(r[1]==='phone'){
        val='<a href="tel:'+esc(String(v).replace(/[^0-9+]/g,''))+'">'+esc(v)+'</a>';
      }else if(r[1]==='line'){
        var lu=lineUrl(v);
        val=lu?'<a href="'+lu+'" target="_blank" rel="noopener">'+esc(v)+'</a>':esc(v);
      }else{
        val=esc(v);
      }
    }
    h+='<div class="basic-r"><span class="k">'+r[0]+'</span>'
      +'<span class="v'+(v?'':' miss')+'">'+val+'</span></div>';
  });
  h+='</div>';
  if(B.exp){
    h+='<div class="sect">專長／經歷</div><div class="basic"><div class="basic-r" style="align-items:flex-start">'
      +'<span class="k">經歷</span><span class="v" style="font-weight:500;line-height:1.55">'+esc(B.exp)+'</span></div></div>';
  }
  if(e.aliasOf){
    h+='<div class="lackbar" style="background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.26);color:#d9b269">'
      +'<span>↻</span><span>履歷登記姓名：'+esc(e.aliasOf)+'（已改名，資料沿用）</span></div>';
  }
  if(e.lacks&&e.lacks.length){
    h+='<div class="lackbar"><span>⚠</span><span>未建檔：'+e.lacks.join('、')
      +'。需補登才能在此直接查看。</span></div>';
  }

  /* 常駐陣地 */
  if(e.sites&&e.sites.length){
    h+='<div class="sect">常駐陣地</div><div class="chips">';
    e.sites.forEach(function(s){ h+='<div class="chip">'+esc(s.n)+'<b>'+s.c+'</b></div>'; });
    h+='</div>';
  }

  /* 常一起出工 */
  if(e.mates&&e.mates.length){
    h+='<div class="sect">常一起出工</div><div class="chips">';
    e.mates.forEach(function(m){
      h+='<div class="chip" data-p="'+esc(m.n)+'" style="cursor:pointer">'+esc(m.n)+'<b>'+m.c+' 次</b></div>';
    });
    h+='</div>';
  }

  /* 異動 */
  if(e.tags&&e.tags.length){
    var tg=e.tags.slice().sort(function(a,b){return b.d.localeCompare(a.d);});
    h+='<div class="sect">異動紀錄（'+tg.length+'）</div>';
    tg.slice(0,10).forEach(function(t){
      var cls=t.t==='半天'?'halfp':(t.t==='沒出來'?'':'okp');
      h+='<div class="lrow"><div class="ld">'+t.d.slice(2)+'</div>'
        +'<div class="ls2">'+esc(t.s)+'</div>'
        +'<span class="tagpill '+cls+'">'+esc(t.t)+'</span></div>';
    });
  }

  /* 最近出工 */
  var recent=Object.keys(p?p.daySet:{}).sort().reverse().slice(0,6);
  if(recent.length){
    h+='<div class="sect">最近出工</div>';
    recent.forEach(function(dt){
      var d=BYDATE[dt], where=[];
      if(d) d.sites.forEach(function(s){
        if(s.people.some(function(x){return x.n===name;})) where.push(s.name);
      });
      h+='<div class="lrow"><div class="ld">'+dt.slice(5).replace('-','/')+' '+wdOf(dt).slice(1)+'</div>'
        +'<div class="ls2">'+(where.length?esc(where.join('、')):'—')+'</div></div>';
    });
  }

  document.getElementById('shBody').innerHTML=h;
  showSheet();
}

function siteSheet(siteName){
  var s=SIDX[siteName]; if(!s) return;
  var days=Object.keys(s.daySet).length;
  var ppl=Object.keys(s.people).sort(function(a,b){return s.people[b]-s.people[a];});
  var mNow=curDate.slice(0,7);
  var mDays=Object.keys(s.daySet).filter(function(x){return x.slice(0,7)===mNow;}).length;
  var ns=normStrength(siteName,curDate);

  document.getElementById('shName').textContent=siteName;
  document.getElementById('shSub').textContent='進駐 '+days+' 天 · 本月 '+mDays+' 天 · '+ppl.length+' 位師傅'
    +(ns?' · 常態 '+ns.avg.toFixed(1)+' 人':'');

  var h='<div class="kv">'
    +'<div class="kvi"><div class="kv1 num">'+days+'</div><div class="kv2">進駐天數</div></div>'
    +'<div class="kvi"><div class="kv1 num">'+s.total+'</div><div class="kv2">累計人次</div></div></div>';

  h+='<div class="sect">派駐過的師傅</div>';
  ppl.forEach(function(n){
    h+='<div class="lrow" data-p="'+esc(n)+'" style="cursor:pointer"><div class="ld">'
      +(PIDX[n]&&PIDX[n].s7?'S7 ':'')+esc(n)+'</div>'
      +'<div class="ls2">出工 '+Object.keys(PIDX[n].daySet).length+' 天</div>'
      +'<span class="tagpill okp">'+s.people[n]+' 次</span></div>';
  });
  document.getElementById('shBody').innerHTML=h;
  showSheet();
}

/* ---------- 事件 ---------- */
function bind(){
  document.getElementById('prev').onclick=function(){
    var i=DAYS.indexOf(curDate);
    if(i>0){curDate=DAYS[i-1];curMonth=curDate.slice(0,7);renderDay();window.scrollTo({top:0,behavior:'smooth'});}
  };
  document.getElementById('next').onclick=function(){
    var i=DAYS.indexOf(curDate);
    if(i<DAYS.length-1){curDate=DAYS[i+1];curMonth=curDate.slice(0,7);renderDay();window.scrollTo({top:0,behavior:'smooth'});}
  };
  document.getElementById('gotoToday').onclick=function(){
    var t=new Date();
    var iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
    if(BYDATE[iso]) curDate=iso;
    else{var past=DAYS.filter(function(x){return x<=iso;});curDate=past.length?past[past.length-1]:DAYS[DAYS.length-1];}
    curMonth=curDate.slice(0,7);renderDay();window.scrollTo({top:0,behavior:'smooth'});
  };
  document.getElementById('printDay').onclick=printToPrinter;
  document.getElementById('previewDay').onclick=downloadSheet;
  if(IS_LOCAL_HTTP){
    var _sl=document.getElementById('staticLink');
    if(_sl) _sl.hidden=false;
  }else{
    var _bl=document.getElementById('backLink');
    if(_bl){ _bl.hidden=false; _bl.onclick=goBackToStatic; }
  }
  document.getElementById('calPrev').onclick=function(){
    var y=+curMonth.slice(0,4),m=+curMonth.slice(5,7)-1;
    if(m<1){m=12;y--;} curMonth=y+'-'+String(m).padStart(2,'0');renderCal();
  };
  document.getElementById('calNext').onclick=function(){
    var y=+curMonth.slice(0,4),m=+curMonth.slice(5,7)+1;
    if(m>12){m=1;y++;} curMonth=y+'-'+String(m).padStart(2,'0');renderCal();
  };
  document.getElementById('cal').addEventListener('click',function(e){
    var b=e.target.closest('.cell[data-d]'); if(!b) return;
    var iso=b.getAttribute('data-d');
    if(BYDATE[iso]){curDate=iso;renderDay();window.scrollTo({top:0,behavior:'smooth'});}
  });
  document.getElementById('posts').addEventListener('click',function(e){
    var m=e.target.closest('.mtag');
    if(m){ personSheet(m.getAttribute('data-p')); return; }
    var pl=e.target.closest('.post');
    if(pl){
      var nm=pl.querySelector('.post-name');
      if(nm) siteSheet(nm.textContent);
    }
  });
  document.getElementById('shBody').addEventListener('click',function(e){
    var r=e.target.closest('[data-p]');
    if(r) personSheet(r.getAttribute('data-p'));
  });
  document.getElementById('standby').addEventListener('click',function(e){
    var t=e.target.closest('[data-p]');
    if(t) personSheet(t.getAttribute('data-p'));
  });
  document.getElementById('shClose').onclick=closeSheet;
  document.getElementById('mask').onclick=closeSheet;
  document.getElementById('logout').onclick=function(){
    try{localStorage.removeItem('cola_explorer_pw');sessionStorage.removeItem('cola_explorer_pw');}catch(e){}
    location.reload();
  };
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') closeSheet();
    if(e.key==='ArrowLeft') document.getElementById('prev').click();
    if(e.key==='ArrowRight') document.getElementById('next').click();
  });
  var rt=null;
  window.addEventListener('resize',function(){
    clearTimeout(rt);
    rt=setTimeout(function(){ if(BYDATE[curDate]) renderDay(); },180);
  });
}

/* ---------- 啟動 ---------- */
function boot(data){
  DATA=data; DAYS=data.days.map(function(d){return d.date;});
  data.days.forEach(function(d){BYDATE[d.date]=d;});
  buildIndex(data.days);
  curDate=DAYS[DAYS.length-1]; curMonth=curDate.slice(0,7);

  document.getElementById('hrange').textContent=DAYS[0].slice(0,7)+' – '+DAYS[DAYS.length-1].slice(0,7);
  document.getElementById('fgen').textContent='更新 '+data.generated;
  document.getElementById('frange').textContent=DAYS[0]+' – '+DAYS[DAYS.length-1];
  document.getElementById('fdays').textContent=data.day_count;
  document.getElementById('fppl').textContent=data.unique_people;
  document.getElementById('fsite').textContent=data.unique_sites;

  document.getElementById('lock').style.display='none';
  document.getElementById('app').hidden=false;
  bind();
  renderDay();
}

async function tryPw(pw,remember){
  try{
    var data=await unlock(pw);
    if(remember){try{localStorage.setItem('cola_explorer_pw',pw);}catch(e){}}
    try{sessionStorage.setItem('cola_explorer_pw',pw);}catch(e){}
    boot(data); return true;
  }catch(e){ return false; }
}

var gobtn=document.getElementById('gobtn'), pwin=document.getElementById('pw');
gobtn.onclick=async function(){
  var pw=pwin.value.trim();
  if(!pw){document.getElementById('lerr').textContent='請輸入通行碼';return;}
  gobtn.textContent='驗證中…';gobtn.disabled=true;
  var ok=await tryPw(pw,document.getElementById('remember').checked);
  if(!ok){document.getElementById('lerr').textContent='通行碼不正確';gobtn.textContent='進 入';gobtn.disabled=false;pwin.select();}
};
pwin.addEventListener('keydown',function(e){if(e.key==='Enter')gobtn.click();});

(function(){
  var pw=null;
  try{pw=sessionStorage.getItem('cola_explorer_pw')||localStorage.getItem('cola_explorer_pw');}catch(e){}
  if(pw){
    gobtn.textContent='驗證中…';gobtn.disabled=true;
    tryPw(pw,true).then(function(ok){if(!ok){gobtn.textContent='進 入';gobtn.disabled=false;}});
  }else{ setTimeout(function(){pwin.focus();},300); }
})();

})();
