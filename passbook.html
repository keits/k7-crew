<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0c110c">
<title>可樂工程行 · 同仁存領薪存摺（手機檢視）</title>
<style>
:root{--panel:#111a12;--panel2:#16221a;--line:#2b3d2e;--line2:#3d5342;--gold:#c9a84c;--goldlit:#e3d48e;--steel:#93a396;--txt:#eef3ea;--dim:#8fa095;--alert:#c4472f;--warn:#d08a2e;--ok:#6fa96b;--blue:#5b9bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100vh;background:#0c110c;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.5;padding-bottom:calc(env(safe-area-inset-bottom) + 80px)}
button,a{font-family:inherit}
.main-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px;background:#111a12;border-bottom:1.5px solid #2b3d2e;position:sticky;top:0;z-index:40}
.tab-item{display:flex;align-items:center;justify-content:center;padding:9px 0;font-size:13px;font-weight:700;border-radius:8px;text-decoration:none;background:#16221a;color:#93a396;border:1px solid #3d5342}
.tab-item.gold-tab{background:linear-gradient(180deg,rgba(201,168,76,.3),rgba(138,116,64,.2));color:#e3d48e;border-color:#c9a84c}
.tab-item.active{box-shadow:0 0 8px rgba(201,168,76,.25)}
.notice{background:#142033;border-bottom:1.5px solid #3b6fb5;color:#cfe0ff;padding:9px 12px;font-size:12.5px;font-weight:700;line-height:1.5;text-align:center}
.notice b{color:#fff;background:#3b6fb5;padding:0 5px;border-radius:3px}
.notice small{display:block;font-weight:500;color:#9fb8e0;margin-top:2px}
.worker-scroller{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#16221a;border-bottom:1px solid #2b3d2e;scrollbar-width:none}
.worker-scroller::-webkit-scrollbar{display:none}
.w-tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid #3d5342;background:#111a12;color:#93a396;cursor:pointer;display:flex;align-items:center;gap:6px}
.w-tab.active{background:linear-gradient(180deg,#c9a84c,#8a7440);color:#050805;border-color:#c9a84c}
.w-badge{font-size:10px;padding:1px 5px;border-radius:10px;background:rgba(0,0,0,.3)}
.sub-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px;background:#111a12;padding:4px;border-radius:10px;border:1px solid #2b3d2e}
.sub-btn{padding:8px 0;font-size:13px;font-weight:700;border-radius:8px;border:none;background:transparent;color:#93a396;cursor:pointer}
.sub-btn.active{background:#16221a;color:#e3d48e;box-shadow:0 2px 6px rgba(0,0,0,.4)}
main{padding:0 12px}
.card{background:#111a12;border:1px solid #2b3d2e;border-radius:12px;padding:14px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:800;color:#e3d48e;padding-bottom:10px;border-bottom:1px solid #2b3d2e;margin-bottom:12px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum-box{background:#16221a;border:1px solid #3d5342;border-radius:10px;padding:10px}
.sum-label{font-size:11px;color:#93a396;margin-bottom:2px}
.sum-val{font-size:20px;font-weight:900}
.green{color:#6fa96b}.red{color:#c4472f}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
.item{background:#16221a;border:1.5px solid #3d5342;border-radius:10px;padding:12px;margin-bottom:10px}
.item.missing{border-color:#c4472f;background:rgba(196,71,47,.12)}
.row1,.row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row1{margin-bottom:6px}
.date{font-size:14px;font-weight:800;color:#e3d48e}
.date a{color:var(--blue);font-size:11.5px;text-decoration:none;font-weight:700;margin-left:6px}
.badge{padding:3px 8px;font-size:11.5px;font-weight:800;border-radius:6px;white-space:nowrap}
.badge.ok{background:rgba(111,169,107,.2);color:#6fa96b;border:1px solid #6fa96b}
.badge.miss{background:#c4472f;color:#fff}
.site{font-size:13.5px;font-weight:700}
.meta{font-size:11.5px;color:var(--steel);margin-top:2px}
.note{color:var(--warn)}
.amt{font-size:16px;font-weight:900;color:#6fa96b;white-space:nowrap}
.amt.frozen{color:#c4472f;text-decoration:line-through;font-size:13px}
.batch{background:#16221a;border:1px solid #3d5342;border-radius:10px;padding:12px;margin-bottom:10px}
.batch-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.batch-t{font-size:14px;font-weight:800;color:#e3d48e}
.batch-a{font-size:15px;font-weight:900;color:#6fa96b}
.batch-d{font-size:12px;color:var(--steel);padding:2px 0}
.empty{padding:28px 12px;text-align:center;color:var(--dim);font-size:13px}
.dock{position:fixed;bottom:0;left:0;right:0;background:rgba(12,17,12,.97);backdrop-filter:blur(12px);border-top:1.5px solid #2b3d2e;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;max-width:800px;margin:0 auto;z-index:30}
.dock-l{font-size:11px;color:#93a396}.dock-a{font-size:18px;font-weight:900;color:#6fa96b}
.btn-copy{padding:9px 14px;font-size:13px;font-weight:800;border-radius:8px;cursor:pointer;background:#16221a;color:#e3d48e;border:1px solid #c9a84c}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(20,32,22,.96);border:1px solid #6fa96b;color:#6fa96b;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:90;display:none}
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#16241a,#050805 70%);padding:24px}
.lockbox{width:100%;max-width:320px;text-align:center}
.lockbox img{width:100px;height:auto;margin-bottom:14px}
.lh{font-size:18px;font-weight:700;letter-spacing:2px;color:var(--gold);margin-bottom:4px}
.ls{font-size:10px;font-weight:600;letter-spacing:3px;color:var(--steel);margin-bottom:20px}
#pw{width:100%;padding:12px 14px;font-size:16px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:10px;text-align:center;letter-spacing:3px;margin-bottom:12px;outline:none}
#gobtn{width:100%;padding:12px;font-size:15px;font-weight:700;letter-spacing:3px;background:linear-gradient(180deg,#c9a84c,#8a7440);color:#050805;border:none;border-radius:10px;cursor:pointer}
</style>
</head>
<body>

<div id="lock">
  <div class="lockbox">
    <img src="assets/logo_320.png" alt="可樂工程行">
    <div class="lh">同仁存領薪存摺</div>
    <div class="ls">VIEW ONLY</div>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="請輸入通行碼">
    <button id="gobtn">進 入</button>
    <div id="lerr" style="min-height:22px;color:var(--alert);font-size:12px;margin-top:8px"></div>
    <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);margin-top:8px;cursor:pointer"><input type="checkbox" id="remember" checked> 記住此手機</label>
  </div>
</div>

<div id="app" hidden>
  <nav class="main-tabs">
    <a href="index.html" class="tab-item">🎖️ 出工指揮</a>
    <a href="sheets.html" class="tab-item">📝 派工表</a>
    <a href="passbook.html" class="tab-item gold-tab active">📒 存領薪</a>
  </nav>

  <div class="notice">
    👀 <b>僅供檢視</b>　手機不能輸入或結算，請在辦公室電腦操作
    <small id="updatedLine">資料時間：—</small>
  </div>

  <div class="worker-scroller" id="workerScroller"></div>

  <div class="sub-tabs">
    <button class="sub-btn active" id="subBtn-unpaid" onclick="switchTab('unpaid')">📗 目前未領明細</button>
    <button class="sub-btn" id="subBtn-history" onclick="switchTab('history')">📜 歷史已領存摺</button>
  </div>

  <main>
    <div id="tab-unpaid">
      <div class="sum-grid">
        <div class="sum-box"><div class="sum-label">✅ 已交單可領</div><div class="sum-val green" id="sumPay">$0</div><div class="sub" id="sumPayDays"></div></div>
        <div class="sum-box"><div class="sum-label">🚫 缺簽單暫扣</div><div class="sum-val red" id="sumFrozen">$0</div><div class="sub" id="sumFrozenN"></div></div>
      </div>
      <section class="card">
        <div class="card-title"><span id="uName"></span> · 未領出工明細</div>
        <div id="unpaidList"></div>
      </section>
    </div>
    <div id="tab-history" style="display:none">
      <section class="card">
        <div class="card-title"><span id="hName"></span> · 歷史結算存摺</div>
        <div id="historyList"></div>
      </section>
    </div>
  </main>

  <div class="dock">
    <div><div class="dock-l">已交單可領（不含缺單）</div><div class="dock-a" id="dockAmt">$0</div></div>
    <button class="btn-copy" onclick="copyLine()">📋 複製 LINE 對帳單</button>
  </div>
</div>
<div id="toast"></div>

<script src="data.enc.js?v=c2ed6b76"></script>
<script>
(function(){
"use strict";

var RAW = null, PB = null, activeWorker = null, activeTab = 'unpaid', URLS = {};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rowTotal(r){ return Math.round((+r.price||0)*(+r.days||0)) + (+r.otAmount||0) + (+r.adjAmount||0); }
function money(n){ return '$' + (Math.round(n)||0).toLocaleString(); }
function toast(m){ var e=document.getElementById('toast'); e.textContent=m; e.style.display='block'; setTimeout(function(){e.style.display='none';},2200); }

function dispatchUrl(dateStr){
  var m = String(dateStr).match(/(\d{3})\/(\d{2})\/(\d{2})/);
  return m ? (URLS[m[1]+m[2]+m[3]] || '') : '';
}

window.switchTab = function(t){
  activeTab = t;
  document.getElementById('tab-unpaid').style.display = t==='unpaid' ? 'block' : 'none';
  document.getElementById('tab-history').style.display = t==='history' ? 'block' : 'none';
  document.getElementById('subBtn-unpaid').className = 'sub-btn' + (t==='unpaid' ? ' active' : '');
  document.getElementById('subBtn-history').className = 'sub-btn' + (t==='history' ? ' active' : '');
};
window.selectWorker = function(n){ activeWorker = n; render(); };

function render(){
  var names = Object.keys(PB.workers);
  document.getElementById('workerScroller').innerHTML = names.map(function(n){
    var w = PB.workers[n];
    return '<div class="w-tab' + (n===activeWorker?' active':'') + '" onclick="selectWorker(\'' + esc(n).replace(/'/g,'') + '\')"><span>' + esc(n) + '</span><span class="w-badge">' + (w.unpaid||[]).length + '工</span></div>';
  }).join('');

  var w = PB.workers[activeWorker];
  document.getElementById('uName').textContent = activeWorker;
  document.getElementById('hName').textContent = activeWorker;

  var pay = 0, payDays = 0, fz = 0, fzN = 0;
  var html = '';
  if(!(w.unpaid||[]).length){
    html = '<div class="empty">🎉 目前沒有未結清的出工紀錄</div>';
  } else {
    html = w.unpaid.map(function(r){
      var sub = rowTotal(r);
      if(r.missingSlip){ fz += sub; fzN++; } else { pay += sub; payDays += (+r.days||0); }
      var u = dispatchUrl(r.date);
      var extra = '';
      if(+r.otAmount) extra += ' +加班' + money(r.otAmount);
      if(+r.adjAmount) extra += (r.adjAmount>0 ? ' +津貼' : ' -先拿') + money(Math.abs(r.adjAmount));
      return '<div class="item' + (r.missingSlip?' missing':'') + '">' +
        '<div class="row1"><div class="date">📅 ' + esc(r.date) + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">🔗派工單</a>' : '') + '</div>' +
        '<span class="badge ' + (r.missingSlip?'miss':'ok') + '">' + (r.missingSlip?'🚫 缺簽單':'✅ 已交單') + '</span></div>' +
        '<div class="row2"><div><div class="site">' + esc(r.site) + '</div>' +
        '<div class="meta">' + esc(r.role) + ' ' + money(r.price) + ' · ' + esc(r.days) + '工' + esc(extra) +
        (r.note ? ' <span class="note">[📝' + esc(r.note) + ']</span>' : '') + '</div></div>' +
        '<div class="amt' + (r.missingSlip?' frozen':'') + '">' + money(sub) + '</div></div></div>';
    }).join('');
  }
  var carry = +w.carryOver || 0;
  pay += carry;
  document.getElementById('unpaidList').innerHTML = html + (carry ? '<div class="meta" style="text-align:right">含前期結轉 ' + money(carry) + '</div>' : '');
  document.getElementById('sumPay').textContent = money(pay);
  document.getElementById('sumPayDays').textContent = payDays.toFixed(1) + ' 工';
  document.getElementById('sumFrozen').textContent = money(fz);
  document.getElementById('sumFrozenN').textContent = fzN + ' 張缺單';
  document.getElementById('dockAmt').textContent = money(pay);

  var hs = w.history || [];
  document.getElementById('historyList').innerHTML = !hs.length ? '<div class="empty">尚無歷史結算紀錄</div>' : hs.map(function(h){
    var lines = '';
    if((h.items||[]).length){
      lines = h.items.map(function(it){ return '<div class="batch-d">・' + esc(it.date) + ' ' + esc(it.site) + '　' + money(rowTotal(it)) + (it.note ? ' [' + esc(it.note) + ']' : '') + '</div>'; }).join('');
    } else if(h.summary){
      lines = String(h.summary).split('、').map(function(s){ return '<div class="batch-d">・' + esc(s) + '</div>'; }).join('');
    }
    return '<div class="batch"><div class="batch-h"><div class="batch-t">' + esc(h.batch || '') + ' · ' + esc(h.settleDate) + '</div>' +
      '<div class="batch-a">實領 ' + money(h.actualPaid) + '</div></div>' +
      '<div class="batch-d" style="color:#8fa095">' + esc(h.daysStr || '') + (h.method ? '｜' + esc(h.method) : '') + (+h.remainCarry ? '｜結轉 ' + money(h.remainCarry) : '') + '</div>' + lines + '</div>';
  }).join('');
}

window.copyLine = function(){
  var w = PB.workers[activeWorker];
  var ok = [], miss = [], total = (+w.carryOver||0);
  (w.unpaid||[]).forEach(function(r){
    var s = rowTotal(r);
    if(r.missingSlip) miss.push('・' + r.date + ' ' + r.site + ' ' + money(s) + '（缺簽單，補單後才能領）');
    else { total += s; ok.push('・' + r.date + ' ' + r.site + '｜' + r.role + ' ' + money(s)); }
  });
  var L = ['【可樂工程行 薪資對帳】', '姓名：' + activeWorker, '──────────────', '✅ 已交單可領：'];
  L = L.concat(ok.length ? ok : ['（無）']);
  if(miss.length){ L.push('──────────────'); L.push('🚫 缺簽單暫扣：'); L = L.concat(miss); }
  L.push('──────────────'); L.push('可領合計：' + money(total));
  var t = L.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast('📋 已複製 LINE 對帳單'); }).catch(function(){ prompt('請複製：', t); });
  } else { prompt('請複製：', t); }
};

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function cat(a,b){var u=new Uint8Array(a.length+b.length);u.set(a,0);u.set(b,a.length);return u;}
async function unlock(pw){
  var e=window.__ENC__; if(!e) throw new Error('no data');
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv),tagLength:128},key,cat(b64(e.ct),b64(e.tag)));
  return JSON.parse(new TextDecoder().decode(pt));
}

function boot(data){
  RAW = data; PB = data.passbooks;
  document.getElementById('lock').style.display = 'none';
  document.getElementById('app').hidden = false;
  (data.dispatch_sheets||[]).forEach(function(s){ if(s && s.roc) URLS[s.roc] = s.url || ''; });
  if(!PB || !PB.workers || !Object.keys(PB.workers).length){
    document.getElementById('unpaidList').innerHTML = '<div class="empty">尚未取得存摺資料<br>（辦公室電腦發布後約 30 分鐘內出現）</div>';
    document.getElementById('workerScroller').innerHTML = '';
    return;
  }
  document.getElementById('updatedLine').textContent = '資料時間：' + (PB.updated || '—') + '（約每 30 分鐘更新，以辦公室 Excel 為準）';
  activeWorker = Object.keys(PB.workers)[0];
  if(PB.workers['林真德']) activeWorker = '林真德';
  render();
}

async function tryPw(pw){
  var err = document.getElementById('lerr'), btn = document.getElementById('gobtn');
  err.textContent = ''; btn.disabled = true;
  try{
    var data = await unlock(pw);
    if(document.getElementById('remember').checked){ try{ localStorage.setItem('k7_crew_pw', pw); }catch(e){} }
    boot(data);
  }catch(e){ err.textContent = '通行密碼錯誤'; btn.disabled = false; }
}
document.getElementById('gobtn').onclick = function(){ tryPw(document.getElementById('pw').value.trim()); };
document.getElementById('pw').onkeydown = function(e){ if(e.key==='Enter') tryPw(this.value.trim()); };
(async function(){
  var s=''; try{ s = localStorage.getItem('k7_crew_pw') || ''; }catch(e){}
  if(s){ try{ boot(await unlock(s)); }catch(e){} }
})();
})();
</script>
</body>
</html>
